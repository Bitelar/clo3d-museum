<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>CLO3D Museum AR</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">DIGITAL FASHION EXHIBITION · 2026</p>
        <h1 id="title">METAMORPHOSIS</h1>
        <p class="student" id="student">Alumno 01</p>
      </div>
      <div class="piece-number" id="pieceNumber">01</div>
    </section>

    <section class="viewer-card">
      <model-viewer
        id="viewer"
        alt="Prenda digital conceptual"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        ar-placement="floor"
        interpolation-decay="100"
      >
        <div class="poster" slot="poster">
          <div class="loader"></div>
          <span>Cargando pieza digital…</span>
        </div>

        <button id="arButton" class="ar-button" slot="ar-button">
          <span class="dot"></span>
          VER EN REALIDAD AUMENTADA
        </button>
      </model-viewer>

      <div class="instructions">
        <div class="step"><span>01</span><p>Escanea el QR con tu celular.</p></div>
        <div class="step"><span>02</span><p>Toca <strong>Ver en realidad aumentada</strong>.</p></div>
        <div class="step"><span>03</span><p>Mueve el teléfono hasta detectar el piso y coloca la prenda.</p></div>
      </div>
    </section>

    <section class="label">
      <div class="meta">
        <span id="technique">CLO3D · Moda digital</span>
        <span id="year">2026</span>
      </div>
      <p class="concept" id="concept"></p>
      <p class="device-note" id="deviceNote"></p>
    </section>

    <div id="error" class="error" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>

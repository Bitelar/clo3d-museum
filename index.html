<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0c">
  <title>CLO3D Digital Fashion Exhibition</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="page">
    <header class="museum-header">
      <p class="eyebrow">DIGITAL FASHION EXHIBITION · 2026</p>
      <h1>CLO3D<br>Museum</h1>
      <p class="intro">Escanea la cédula de una pieza y colócala en tu espacio a escala real.</p>
    </header>

    <section class="artwork" aria-live="polite">
      <div class="viewer-wrap">
        <model-viewer
          id="viewer"
          alt="Prenda digital conceptual"
          camera-controls
          touch-action="pan-y"
          shadow-intensity="1"
          exposure="1"
          environment-image="neutral"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          interpolation-decay="100"
        >
          <button class="ar-button" slot="ar-button">VER EN REALIDAD AUMENTADA</button>
          <div class="loading" slot="poster">Cargando pieza digital…</div>
        </model-viewer>
      </div>

      <article class="label">
        <div class="piece-number" id="pieceNumber">01</div>
        <div class="label-copy">
          <h2 id="title">METAMORPHOSIS</h2>
          <p class="student" id="student">Alumno 01</p>
          <div class="meta">
            <span id="technique">CLO3D · Moda digital</span>
            <span id="year">2026</span>
          </div>
          <p class="concept" id="concept"></p>
        </div>
      </article>

      <div id="error" class="error" hidden></div>
    </section>

    <footer>
      <span>Exposición académica</span>
      <span>Diseño 3D · AR</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
